<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 48px 20px; }
    a.button {
      display: inline-block; margin-top: 24px; padding: 16px 32px;
      font-size: 20px; font-weight: 600; color: white; background: #0071e3;
      border-radius: 12px; text-decoration: none;
    }
    p { color: #444; font-size: 16px; }
  </style>
</head>
<body>
  <p>Tap the button below right away — this link expires quickly.</p>
  <a class="button" id="continue-link" href="#">Continue to Scriptable</a>
  <script>
    // Generic OAuth redirect relay: forwards this page's query string
    // (e.g. ?code=...&state=...) into a Scriptable URL scheme so iOS hands
    // control back to the Scriptable app, since many OAuth providers only
    // accept https redirect URIs and won't accept a custom app URL scheme
    // directly.
    //
    // Deliberately NOT auto-redirecting via window.location: iOS Safari
    // silently blocks script-triggered navigation into a custom URL scheme
    // unless it comes from a direct user tap, and the delay while a user
    // notices nothing happened is enough for a short-lived OAuth code to
    // expire. A big, immediate, real tap target avoids both problems.
    var params = window.location.search;
    var scriptName = "01-oura-auth-setup";
    var target = "scriptable:///run/" + scriptName + params;
    document.getElementById("continue-link").href = target;
  </script>
</body>
</html>
