<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
</head>
<body>
  <p id="msg">Redirecting back to the app…</p>
  <script>
    // Generic OAuth redirect relay: forwards this page's query string
    // (e.g. ?code=...&state=...) into a Scriptable URL scheme so iOS hands
    // control back to the Scriptable app automatically, since many OAuth
    // providers only accept https redirect URIs and won't accept a custom
    // app URL scheme directly.
    var params = window.location.search;
    var scriptName = "01-oura-auth-setup";
    var target = "scriptable:///run/" + scriptName + params;
    document.getElementById("msg").innerHTML =
      "Redirecting back to the app… if nothing happens, " +
      "<a href=\"" + target + "\">tap here</a>.";
    window.location.href = target;
  </script>
</body>
</html>
